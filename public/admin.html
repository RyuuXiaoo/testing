<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - RyuuXiao</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><nav class="nav"><b class="brand">Ryuu<span>Xiao</span> Admin</b><a href="/profile.html">Profile</a></nav><div class="card"><h1>User & Premium</h1><div class="scroll"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Berakhir</th><th>Aksi</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card" style="margin-top:18px"><h1>Blacklist IP</h1><form id="bf" class="row"><input class="input" style="max-width:280px" name="ip" placeholder="IP address" required><input class="input" style="max-width:280px" name="reason" placeholder="Alasan"><button class="btn danger">Blacklist</button></form><div class="scroll"><table><tbody id="bl"></tbody></table></div></div></div><script>
const H={'Authorization':'Bearer '+localStorage.token,'Content-Type':'application/json'};async function load(){let r=await fetch('/admin/users',{headers:H}),d=await r.json();if(!d.status)return location='/profile.html';users.innerHTML=d.users.map(u=>`<tr><td><b>${u.username}</b><br><span class="small">${u.email}</span></td><td>${u.role}</td><td>${u.premium?'PREMIUM':'FREE'}</td><td>${u.premiumUntil?new Date(u.premiumUntil).toLocaleDateString('id-ID'):'-'}</td><td><button class="btn ${u.premium?'danger':''}" onclick="toggle('${u.id}',${!u.premium})">${u.premium?'Matikan':'Aktifkan'}</button></td></tr>`).join('');r=await fetch('/admin/blacklist',{headers:H});d=await r.json();bl.innerHTML=d.items.map(x=>`<tr><td>${x.ip}</td><td>${x.reason}</td><td><button class="btn secondary" onclick="unblock('${x.ip}')">Hapus</button></td></tr>`).join('')}
async function toggle(id,enabled){let days=prompt('Berapa hari premium?', '30');if(days===null)return;let r=await fetch('/admin/users/'+id+'/premium',{method:'PATCH',headers:H,body:JSON.stringify({enabled,days:Number(days),limit:1000})});alert((await r.json()).message||'Selesai');load()}
bf.onsubmit=async e=>{e.preventDefault();let r=await fetch('/admin/blacklist',{method:'POST',headers:H,body:JSON.stringify(Object.fromEntries(new FormData(bf)))});alert((await r.json()).message||'Selesai');bf.reset();load()};async function unblock(ip){await fetch('/admin/blacklist/'+encodeURIComponent(ip),{method:'DELETE',headers:H});load()}load();
</script></body></html>
