<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · RyuuXiao Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="admin">
    <div class="container">
    <div class="topbar">
      <div class="brand" style="margin:0">
        <div class="brand-badge">AD</div>
        <div>
          <div class="small muted">Panel admin</div>
          <div style="font-size:18px;font-weight:900" id="displayName">Admin</div>
        </div>
      </div>
      <div class="nav-links">
        <a class="btn btn-ghost" href="/profile">Profile</a>
        <a class="btn btn-ghost" href="/admin">Admin</a>
        <button class="btn btn-danger" id="logoutBtn" type="button">Keluar</button>
      </div>
    </div>
    <div id="toast" hidden></div>

    <div class="grid-3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Total user</div><div class="v" id="userCount">0</div></div>
      <div class="stat"><div class="k">Blacklist IP</div><div class="v" id="blacklistCount">0</div></div>
      <div class="stat"><div class="k">Aksi utama</div><div class="v">Premium / Key / Block</div></div>
    </div>

    <section class="card panel" style="margin-bottom:16px">
      <h2 style="margin:0 0 12px">Blacklist IP</h2>
      <form id="addIpForm" class="stack">
        <div class="form-grid">
          <div>
            <label class="label">IP</label>
            <input id="ipToBlock" class="input" placeholder="192.168.1.1" required>
          </div>
          <div>
            <label class="label">Alasan</label>
            <input id="blockReason" class="input" placeholder="spam / abuse / dll">
          </div>
        </div>
        <button class="btn btn-danger" type="submit">Tambahkan ke Blacklist</button>
      </form>
      <div class="hr"></div>
      <div id="blacklistList" class="stack"></div>
    </section>

    <section class="card panel">
      <h2 style="margin:0 0 12px">Kelola User</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th><th>Email</th><th>Phone</th><th>Role</th><th>Daily Limit</th><th>Premium Until</th><th>API Key</th><th>Ubah Role</th><th>Block</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
