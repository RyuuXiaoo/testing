<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - RyuuXiao</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><nav class="nav"><b class="brand">Ryuu<span>Xiao</span></b><a href="/">Beranda</a></nav><div class="card" style="max-width:480px;margin:7vh auto"><h1>Login</h1><p class="muted">Masuk ke akun kamu.</p><form id="f"><input class="input" name="login" placeholder="Username / Email / Nomor TLP" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn">Masuk</button></form><div id="msg"></div><p><a href="/forgot.html">Lupa password?</a> · Belum punya akun? <a href="/register.html">Daftar</a></p></div></div><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(d.status){localStorage.token=d.token;location='/profile.html'}else msg.innerHTML='<p class="error">'+d.message+'</p>'}</script></body></html>
