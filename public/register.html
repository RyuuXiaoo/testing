<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar · RyuuXiao Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="register">
  <div class="container">
    <div class="hero" style="grid-template-columns:1fr">
      <section class="card panel">
        <div class="topbar">
          <div class="brand" style="margin:0">
            <div class="brand-badge">RX</div>
            <div>
              <div class="small muted">Form pendaftaran</div>
              <div style="font-size:18px;font-weight:900">Buat akun baru</div>
            </div>
          </div>
          <button class="btn btn-ghost" id="backLogin" type="button">Kembali</button>
        </div>
        <div id="toast" hidden></div>
        <form id="registerForm" class="stack">
          <div class="form-grid">
            <div>
              <label class="label">Username</label>
              <input id="username" class="input" placeholder="username" required>
            </div>
            <div>
              <label class="label">Email</label>
              <input id="email" type="email" class="input" placeholder="email" required>
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label class="label">Nomor TLP / WhatsApp</label>
              <input id="phone" class="input" placeholder="62812xxxxxxxx" required>
            </div>
            <div>
              <label class="label">Foto Profile (link opsional)</label>
              <input id="avatarUrl" class="input" placeholder="https://...">
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label class="label">Password</label>
              <input id="password" type="password" class="input" required>
            </div>
            <div>
              <label class="label">Konfirmasi Password</label>
              <input id="confirmPassword" type="password" class="input" required>
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Daftar</button>
        </form>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
