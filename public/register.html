<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - RyuuXiao</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><nav class="nav"><b class="brand">Ryuu<span>Xiao</span></b><a href="/login.html">Login</a></nav><div class="card" style="max-width:520px;margin:4vh auto"><h1>Buat akun</h1><form id="f"><input class="input" name="username" placeholder="Username" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="phone" placeholder="Nomor TLP / WhatsApp" required><input class="input" name="password" type="password" placeholder="Password minimal 6 karakter" required><input class="input" name="avatar" placeholder="Link foto profile (opsional)"><button class="btn">Daftar</button></form><div id="msg"></div></div></div><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();msg.innerHTML='<p class="'+(d.status?'ok':'error')+'">'+d.message+'</p>';if(d.status){localStorage.token=d.token;setTimeout(()=>location='/profile.html',500)}}</script></body></html>
