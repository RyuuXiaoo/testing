<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="card" style="max-width:500px;margin:8vh auto"><h1>Reset Password</h1><p class="muted">Kode verifikasi dikirim ke WhatsApp melalui Fonnte.</p><form id="send"><input class="input" name="phone" placeholder="Nomor WhatsApp" required><button class="btn">Kirim Kode</button></form><div id="msg"></div><hr style="border-color:#1c3a29;margin:22px 0"><form id="reset"><input class="input" name="phone" placeholder="Nomor WhatsApp" required><input class="input" name="code" placeholder="Kode 6 digit" required><input class="input" name="newPassword" type="password" placeholder="Password baru" required><button class="btn secondary">Ubah Password</button></form><p><a href="/login.html">Kembali login</a></p></div></div><script>send.onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/forgot/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(send)))}),d=await r.json();msg.innerHTML='<p class="'+(d.status?'ok':'error')+'">'+d.message+'</p>'};reset.onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/forgot/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(reset)))}),d=await r.json();msg.innerHTML='<p class="'+(d.status?'ok':'error')+'">'+d.message+'</p>';if(d.status)setTimeout(()=>location='/login.html',700)}</script></body></html>
