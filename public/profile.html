<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - RyuuXiao</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><nav class="nav"><b class="brand">Ryuu<span>Xiao</span></b><div class="row"><a href="/docs">Home</a><button class="btn danger" onclick="logout()">Logout</button></div></nav><div id="app">Loading...</div></div><script>
const token=localStorage.token;if(!token)location='/login.html';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
async function load(){const r=await fetch('/auth/me',{headers:H});const d=await r.json();if(!d.status){localStorage.removeItem('token');return location='/login.html'}const u=d.user;app.innerHTML=`<div class="card"><div class="row" style="align-items:center"><img class="avatar" src="${u.avatar||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username)}"><div><h1 style="margin:0">${u.username}</h1><span class="tag">${u.premium?'PREMIUM':'FREE'}</span> ${u.role==='admin'?'<span class="tag">ADMIN</span>':''}</div></div><div class="grid" style="margin-top:22px"><div class="card"><div class="muted">Role</div><div class="stat">${u.role}</div></div><div class="card"><div class="muted">Email</div><div class="stat" style="font-size:18px">${u.email}</div></div><div class="card"><div class="muted">Limit harian</div><div class="stat">${u.usedToday} / ${u.dailyLimit}</div></div><div class="card"><div class="muted">Premium berakhir</div><div class="stat" style="font-size:18px">${u.premiumUntil?new Date(u.premiumUntil).toLocaleString('id-ID'):'Tidak aktif'}</div></div></div><hr style="border-color:#1c3a29;margin:24px 0"><h2>API Key</h2><p class="muted">Free hanya dapat memakai <b>RyuuXiao</b>. Premium mendapatkan custom key.</p><div class="row"><input id="keyInput" class="input" style="max-width:500px" ${u.premium?'':'readonly'} value="${u.premium?u.apiKey:'RyuuXiao'}" placeholder="Custom API key"><button class="btn" ${u.premium?'':'disabled'} onclick="saveKey()">Simpan Key</button><button class="btn secondary" ${u.premium?'':'disabled'} onclick="regen()">Generate</button></div><h2>Pengaturan Profile</h2><form id="avatar"><input class="input" name="avatar" value="${u.avatar||''}" placeholder="Link foto profile"><button class="btn">Simpan Foto</button></form><form id="uname" style="margin-top:10px"><input class="input" name="username" value="${u.username}" placeholder="Username baru"><button class="btn secondary">Tukar Username</button></form>${u.role==='admin'?'<p style="margin-top:20px"><a class="btn" href="/admin.html">Buka Admin Panel</a></p>':''}<div id="msg"></div></div>`}
async function saveKey(){const key=document.getElementById('keyInput').value;const r=await fetch('/auth/apikey',{method:'PATCH',headers:H,body:JSON.stringify({apiKey:key})}),d=await r.json();alert(d.message||d.apiKey);if(d.status)load()}async function regen(){const r=await fetch('/auth/apikey/regenerate',{method:'POST',headers:H}),d=await r.json();alert(d.message||d.apiKey);load()}
document.addEventListener('submit',async e=>{if(e.target.id!=='avatar'&&e.target.id!=='uname')return;e.preventDefault();const url=e.target.id==='avatar'?'/auth/profile':'/auth/username';const r=await fetch(url,{method:'PATCH',headers:H,body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();document.getElementById('msg').innerHTML='<p class="'+(d.status?'ok':'error')+'">'+d.message+'</p>';if(d.status)load()});
function logout(){localStorage.removeItem('token');location='/login.html'}load();
</script></body></html>
